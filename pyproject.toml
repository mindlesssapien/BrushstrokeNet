[project]
name = "BrushstrokeNet"
version = "0.2.0"
description = "Neural style transfer (Gatys et al.) with PyTorch and a FastAPI job API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ipykernel>=6.29.5",
]
rocm = [
    "pytorch-triton-rocm; sys_platform == 'linux'",
]

[tool.uv]
default-groups = ["dev", "rocm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Local dev on an AMD GPU: `uv sync` pulls PyTorch's ROCm build instead of the default
# (NVIDIA) wheels from PyPI. Delete this block on a machine without an AMD GPU.
# Docker ignores it and picks the build with the TORCH_INDEX build arg.
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }
